name: Build and Dockerize

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Build Docker image
        run: docker build -f BeerBot/Dockerfile -t beerbot:${{ github.sha }} BeerBot

      - name: Export image to tarball
        run: docker save beerbot:${{ github.sha }} -o beerbot-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: beerbot-docker-image
          path: beerbot-image.tar
          retention-days: 7
